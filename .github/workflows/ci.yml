name: ADBMedic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests (${{ matrix.shell }})
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Audit exact source, index and history
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($mode in @('Worktree', 'Staged', 'History')) {
            & ./privacy-audit.ps1 -Mode $mode
            if ($LASTEXITCODE -ne 0) { throw "Privacy gate failed: $mode" }
          }
      - name: Run offline synthetic tests
        shell: ${{ matrix.shell }}
        run: ./scripts/Run-CI.ps1

  package:
    name: Verified source archive
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build and re-audit source archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Build-SafeSourceArchive.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Source archive validation failed.' }
      - name: Upload verified source only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ADBMedic-source-${{ github.sha }}
          path: exports/ADBMedic-source.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  gate:
    name: CI
    if: always()
    needs: [verify, package]
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        shell: powershell
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          if ($env:VERIFY_RESULT -ne 'success' -or $env:PACKAGE_RESULT -ne 'success') {
            throw 'Required CI jobs did not all succeed.'
          }
          Write-Output 'CI: PASS'
